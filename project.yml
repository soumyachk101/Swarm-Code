name: SwarmCode
options:
  bundleIdPrefix: iordv
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.20.0
settings:
  base:
    MARKETING_VERSION: "1.7.2"
    CURRENT_PROJECT_VERSION: "21"
    ARCHS: arm64
    EXCLUDED_ARCHS: x86_64
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: NARHG44L48
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  SwarmCode:
    type: application
    platform: macOS
    sources:
      - path: SwarmCode
        type: syncedFolder
      # The license, the third-party notices and the trademark policy travel with every copy of
      # the app; About shows them under Licenses.
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: TRADEMARK.md
        buildPhase: resources
    dependencies:
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_NAME: "Swarm Code"
        PRODUCT_MODULE_NAME: SwarmCode
        PRODUCT_BUNDLE_IDENTIFIER: iordv.swarmcode
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Swarm Code"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "Swarm Code, the coding app by Soumya Chakraborty. MIT License."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEAD_CODE_STRIPPING: YES
        SWIFT_OBJC_BRIDGING_HEADER: SwarmCode/App/Window/SwarmCode-Bridging-Header.h
      configs:
        Debug:
          PRODUCT_NAME: "Swarm Code Dev"
          PRODUCT_BUNDLE_IDENTIFIER: iordv.swarmcode.dev
          INFOPLIST_KEY_CFBundleDisplayName: "Swarm Code Dev"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
