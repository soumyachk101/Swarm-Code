name: Cody
options:
  bundleIdPrefix: iordv
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.20.0
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    ARCHS: arm64
    EXCLUDED_ARCHS: x86_64
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: NARHG44L48
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  Cody:
    type: application
    platform: macOS
    sources:
      - path: Cody
        type: syncedFolder
    dependencies:
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_NAME: Cody
        PRODUCT_MODULE_NAME: Cody
        PRODUCT_BUNDLE_IDENTIFIER: iordv.cody
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cody
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: Cody. MIT License.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEAD_CODE_STRIPPING: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
