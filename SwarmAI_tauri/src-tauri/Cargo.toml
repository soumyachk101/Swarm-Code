[package]
name = "swarmai_tauri"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
notify = "6"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
base64 = "0.22"
regex = "1"
glob = "0.3"
futures = "0.3"
parking_lot = "0.12"
thiserror = "1"
async-trait = "0.1"
rodio = "0.19"
image = "0.25"
global-hotkey = "0.7"
portable-pty = "0.9"
url = "2"
libc = "0.2"
tracing = "0.1"
